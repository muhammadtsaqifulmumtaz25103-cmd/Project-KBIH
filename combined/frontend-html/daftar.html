<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Keanggotaan | KBIHU Aisyiyah</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="navbar">
    <a href="index.html" class="brand"><span class="logo-circle">🕋</span> KBIHU Aisyiyah</a>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Beranda</a>
      <a href="tentang.html">Tentang Balai</a>
      <a href="jadwal.html">Jadwal Kegiatan</a>
      <a href="kegiatan.html">Daftar Kegiatan</a>
      <a href="benefit.html">Benefit</a>
      <span id="navAkun" style="display:flex; gap:4px;"></span>
    </nav>
  </div>
</header>

<main>
  <h1 class="page-title text-center">Pendaftaran Keanggotaan</h1>
  <p class="page-subtitle text-center">Lengkapi data diri Anda untuk menjadi anggota KBIHU Aisyiyah.</p>

  <div class="card form-card">
    <div id="alertBox" class="alert"></div>

    <form id="formDaftar" novalidate>
      <div class="form-group">
        <label for="nik">NIK (Nomor Induk Kependudukan)</label>
        <input type="text" id="nik" maxlength="16" placeholder="16 digit angka">
        <div class="field-error" id="err-nik"></div>
      </div>

      <div class="form-group">
        <label for="namaLengkap">Nama Lengkap</label>
        <input type="text" id="namaLengkap" placeholder="Sesuai KTP">
        <div class="field-error" id="err-namaLengkap"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com">
        <div class="field-error" id="err-email"></div>
      </div>

      <div class="form-group">
        <label for="noHp">Nomor HP / WhatsApp</label>
        <input type="text" id="noHp" placeholder="08xxxxxxxxxx">
        <div class="field-error" id="err-noHp"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimal 8 karakter">
        <div class="field-error" id="err-password"></div>
      </div>

      <div class="form-group">
        <label for="konfirmasiPassword">Konfirmasi Password</label>
        <input type="password" id="konfirmasiPassword">
        <div class="field-error" id="err-konfirmasiPassword"></div>
      </div>

      <button type="submit" class="btn btn-solid btn-block">Daftar</button>
    </form>

    <p class="text-center text-muted" style="margin-top:16px;">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
    </p>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div><strong>KBIHU Aisyiyah</strong></div>
    <div><a href="index.html">Kembali ke Beranda</a></div>
  </div>
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  const form = document.getElementById("formDaftar");

  function setFieldError(id, message) {
    const el = document.getElementById(`err-${id}`);
    if (message) {
      el.textContent = message;
      el.classList.add("show");
    } else {
      el.textContent = "";
      el.classList.remove("show");
    }
  }

  function validateForm(data) {
    let valid = true;

    if (!/^\d{16}$/.test(data.nik)) {
      setFieldError("nik", "NIK harus terdiri dari 16 digit angka.");
      valid = false;
    } else setFieldError("nik", "");

    if (data.namaLengkap.trim().length < 3) {
      setFieldError("namaLengkap", "Nama lengkap wajib diisi (minimal 3 karakter).");
      valid = false;
    } else setFieldError("namaLengkap", "");

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      setFieldError("email", "Format email tidak valid.");
      valid = false;
    } else setFieldError("email", "");

    if (data.noHp.trim().length < 9) {
      setFieldError("noHp", "Nomor HP tidak valid.");
      valid = false;
    } else setFieldError("noHp", "");

    if (data.password.length < 8) {
      setFieldError("password", "Password minimal 8 karakter.");
      valid = false;
    } else setFieldError("password", "");

    if (data.password !== data.konfirmasiPassword) {
      setFieldError("konfirmasiPassword", "Konfirmasi password tidak sama.");
      valid = false;
    } else setFieldError("konfirmasiPassword", "");

    return valid;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert("alertBox");

    const data = {
      nik: document.getElementById("nik").value.trim(),
      namaLengkap: document.getElementById("namaLengkap").value.trim(),
      email: document.getElementById("email").value.trim(),
      noHp: document.getElementById("noHp").value.trim(),
      password: document.getElementById("password").value,
      konfirmasiPassword: document.getElementById("konfirmasiPassword").value,
    };

    if (!validateForm(data)) return;

    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "Memproses...";

    try {
      await daftarAnggota(data);
      showAlert(
        "alertBox",
        "Pendaftaran berhasil! Silakan masuk menggunakan email dan password yang baru saja Anda buat.",
        "success"
      );
      form.reset();
      setTimeout(() => (window.location.href = "login.html"), 1800);
    } catch (err) {
      showAlert("alertBox", err.message, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Daftar";
    }
  });
</script>
</body>
</html>
